name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  calcul:
    name: Tests du calcul (sans fenêtre)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/requirements.lock
      - run: pip install -r requirements.lock pytest pytest-qt
      - run: python -m pytest -q -m "not qt" -p no:cacheprovider

  bureau:
    name: Tests de l'interface de bureau (Qt hors écran)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/requirements.lock
      - name: Bibliothèques système de Qt
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libfontconfig1
      - run: pip install -r requirements.lock pytest pytest-qt
      - run: python -m pytest -q -m qt -p no:cacheprovider

  site:
    name: "Site (Pyodide) : à jour et mêmes résultats que le bureau"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/requirements.lock
      - run: pip install -r application/requirements.lock playwright
      - run: playwright install --with-deps chromium
      # le zip, les empreintes et le service worker de docs/ doivent être ceux que construire_web.py fabrique
      - name: docs/ est à jour
        run: |
          python construire_web.py
          git diff --exit-code -- docs/mecastruct.zip docs/index.html docs/sw.js docs/app.js
      - name: Mêmes résultats dans le navigateur et sur le bureau
        working-directory: application
        run: python tools/parite_site.py
      - name: Empreintes (integrity) des scripts tiers
        run: python application/tools/verifier_sri.py
