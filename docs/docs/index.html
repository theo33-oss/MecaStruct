<!-- Ancienne adresse du site (…/MecaStruct/docs/), du temps où GitHub Pages publiait la racine du dépôt.

<script>
// l'ancien service worker (portée …/docs/) ne sert plus : on le retire, puis on renvoie vers le site
try {
  if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistration().then(function (r) { if (r && /\/docs\/$/.test(r.scope)) r.unregister(); });
} catch (e) { /* rien */ }
location.replace("../" + location.hash);
</script>
